name: tests
on:
  push:
    branches: [next, dev]
  pull_request:
    branches: [next, dev]
jobs:
  tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format-check
      - run: pnpm lint-js
      - run: pnpm lint-md
      - run: pnpm test --run
